# 发布仓库 → 阿里云 OSS 镜像（大陆首选下载源）
#   发布仓库是唯一源头，OSS 只是镜像；官网、软件内更新、测试版都读同一份 OSS 清单。
#   触发：发布 Release、私有仓库构建流水线更新分支后手动触发（workflow_dispatch），以及每 10 分钟兜底检查一次。
#   公开仓库的 Actions 免费，此处使用 Linux runner，不占用私有仓库的 Windows 分钟额度。
#   不使用 continue-on-error：失败必须让任务变红，才不会出现 GitHub 与 OSS 悄悄不一致。
name: mirror-oss
on:
  workflow_dispatch:
  release:
    types: [published, edited]
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: mirror-oss
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 检查凭据是否已配置
        run: |
          for n in OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET OSS_BUCKET OSS_ENDPOINT; do
            if [ -z "${!n}" ]; then echo "::error::未配置仓库密钥 $n，已终止镜像"; exit 1; fi
          done

      - name: 轻量检查（定时触发时，已一致则跳过）
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          set +e
          python3 -I tools/mirror_oss.py --check-only
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "10" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"
          else exit "$rc"; fi

      - name: 取各数据分支
        if: steps.check.outputs.needed == 'true'
        run: |
          for b in setup setup-beta data-pack data-pack-beta cloud-dict; do
            if git ls-remote --exit-code --heads origin "$b" > /dev/null 2>&1; then
              git fetch --no-tags --depth 1 origin "+refs/heads/$b:refs/remotes/origin/$b"
            else
              echo "分支 $b 不存在，已跳过"
            fi
          done

      - name: 镜像到阿里云 OSS（先数据、后清单、再固定路径，最后审计）
        if: steps.check.outputs.needed == 'true'
        run: python3 -I tools/mirror_oss.py
