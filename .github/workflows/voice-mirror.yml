# 语音包 Release（voice-*）→ OSS voice/；安卓安装包 Release（android-v*）→ OSS android/ + latest.json
#   语音运行库与模型单文件超过 git 100 MB 上限，不经数据分支，直接把 Release 附件镜像到 OSS。
#   客户端下载顺序：OSS voice/<文件名> 优先，失败回退到本仓库 Release voice-v1 的附件。
name: voice-mirror
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release 标签（voice- 或 android-v 开头）
        required: true
        default: voice-v1
      code:
        description: 安卓 versionCode（android-v* 必填）
        required: false
        default: ''
  release:
    types: [published]

concurrency:
  group: voice-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'voice-') || startsWith(github.event.release.tag_name, 'android-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      GITHUB_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      CODE: ${{ inputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 镜像 Release 附件到 OSS
        run: python3 -I tools/mirror_voice.py --tag "$TAG" --code "$CODE"
